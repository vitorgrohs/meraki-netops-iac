# Estado desejado de uma filial FICTÍCIA. Todos os IDs e endereços são de exemplo.
network: N_000000000000000001

vlans:
  - id: 1
    name: Default
    subnet: 192.168.128.0/24
    appliance_ip: 192.168.128.1
  - id: 10
    name: Corporativa
    subnet: 10.10.10.0/24
    appliance_ip: 10.10.10.1
  - id: 20
    name: Visitantes
    subnet: 10.10.20.0/24
    appliance_ip: 10.10.20.1
  - id: 30
    name: IoT
    subnet: 10.10.30.0/24
    appliance_ip: 10.10.30.1

firewall_l3:
  - comment: Visitantes nao acessam a rede corporativa
    policy: deny
    src_cidr: 10.10.20.0/24
    dest_cidr: 10.10.10.0/24
  - comment: IoT nao acessa a rede corporativa
    policy: deny
    src_cidr: 10.10.30.0/24
    dest_cidr: 10.10.10.0/24
  - comment: Corporativa gerencia IoT via HTTPS
    policy: allow
    protocol: tcp
    src_cidr: 10.10.10.0/24
    dest_cidr: 10.10.30.0/24
    dest_port: "443"
